<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crashy Ducks — Red Pixels</title>
<meta name="description" content="Crashy Ducks — a chaotic endless runner with robot ducks by Red Pixels.">
<link rel="icon" href="img/icon.png">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@600;700&family=Rubik:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --ink: #101018; --paper: #f2ecdd; --y: #ffd23f; --p: #ff2fa8; --c: #2ff0e6; --o: #ff7a2f; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
    background: #121219 radial-gradient(circle, #2b2b38 1.6px, transparent 2px) 0 0 / 22px 22px; color: var(--ink); font: 400 17px/1.5 Rubik, sans-serif; }
  .card { max-width: 760px; width: 100%; background: var(--paper); border: 4px solid var(--ink); box-shadow: 12px 12px 0 var(--o); }
  .card img { display: block; width: 100%; border-bottom: 4px solid var(--ink); }
  .in { padding: 22px 26px 26px; }
  h1 { font: 400 46px/1 Anton, sans-serif; margin: 0 0 8px; color: var(--y); -webkit-text-stroke: 1.5px var(--ink); text-shadow: -2px 0 var(--c), 2px 0 var(--p), 4px 4px 0 var(--ink); text-transform: uppercase; }
  a.btn { display: inline-block; margin-top: 14px; margin-right: 10px; font: 700 16px Oswald, sans-serif; text-transform: uppercase; letter-spacing: 0.05em;
    padding: 10px 18px; border: 3px solid var(--ink); background: var(--y); color: var(--ink); text-decoration: none; box-shadow: 5px 5px 0 var(--ink); }
  a.btn.alt { background: var(--c); }
</style>
</head>
<body>
  <div class="card">
    <img src="img/banner.jpg" alt="Crashy Ducks">
    <div class="in">
      <h1>Crashy Ducks</h1>
      <p>A chaotic endless runner: robot ducks smash everything in their way, collect coins, boop robo-dogs and grow a duck squad. A game by Red Pixels.</p>
      <a class="btn" href="privacy/">Privacy Policy</a><a class="btn alt" href="privacy/#ru">Политика конфиденциальности</a>
    </div>
  </div>
</body>
</html>
